[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileviewer"
version = "2.0.4"
description = "Web-based file browser and viewer with support for images, video, audio, archives, tabular data, MIDI, hex, and more"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "SkyTNT" }
]
keywords = [
    "file browser",
    "file viewer",
    "web ui",
    "fastapi",
    "image viewer",
    "archive",
    "dataframe",
    "midi",
    "hex viewer",
    "file manager",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Environment :: Web Environment",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "polars>=0.20",
    "httpx>=0.27",
    "async-lru>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "pyzipper>=0.3",
    "psd_tools>=1.16.0",
    "mutagen>=1.47.0"
]

[project.optional-dependencies]
archive = ["py7zr"]

[project.scripts]
fileviewer = "cli:main"

[project.urls]
Homepage = "https://github.com/SkyTNT/fileviewer"
Repository = "https://github.com/SkyTNT/fileviewer"
Issues = "https://github.com/SkyTNT/fileviewer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel*", "plugins*", "static*"]

[tool.setuptools.package-data]
static = ["**/*"]
"*" = ["*.toml"]
"plugins.midi" = ["soundfonts/*"]

[tool.setuptools]
py-modules = ["cli", "server", "config"]
